[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quito"
version = "0.1.0"
description = "QUITO: Time Series Forecasting Framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Alipay", email = "opensource@alipay.com"}
]
keywords = [
    "time-series",
    "forecasting",
    "deep-learning",
    "transformer",
    "machine-learning",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Core dependencies
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "scipy>=1.16.3",
    "scikit-learn>=1.8.0",
    
    # Deep learning and training
    "transformers>=4.57.1",
    "datasets>=4.5.0",
    "accelerate>=1.12.0",
    "deepspeed>=0.18.2",
    "tensorboard>=2.14.0",
    "ray>=2.51.1",
    
    # Time series specific
    "statsmodels>=0.14.6",
    "tslearn>=0.7.0",
    "dtaidistance>=2.3.13",
    "pyts>=0.13.0",
    
    # Data processing and visualization
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "plotly>=6.5.2",
    "bokeh>=3.8.2",
    
    # Utilities
    "tqdm>=4.67.1",
    "pyyaml>=6.0",
    "click>=8.1.8",
    "rich>=14.1.0",
    "omegaconf>=2.3.0",
    "einops>=0.8.1",
    "pyarrow>=22.0.0",
    
    # Evaluation and metrics
    "scikit-image>=0.19.0",
    "opencv-python>=4.5.0",
    "lpips>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=22.0.0",
    "flake8>=3.9.0",
    "mypy>=0.950",
    "isort>=5.10.0",
]

foundation = [
    "chronos-forecasting>=2.0",
]

jax = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "flax>=0.6.0",
]

all = [
    "quito[dev,foundation,jax]",
]

[project.urls]
Homepage = "https://github.com/alipay/quito-10b"
Repository = "https://github.com/alipay/quito-10b"
Documentation = "https://github.com/alipay/quito-10b/tree/main/docs"
"Bug Tracker" = "https://github.com/alipay/quito-10b/issues"

[project.scripts]
quito-cli = "cli:main"

[tool.setuptools]
packages = ["quito", "quito.config", "quito.models", "quito.trainers", "quito.utils"]
py-modules = ["cli"]
include-package-data = true

[tool.setuptools.package-data]
quito = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312", "py313"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--cov=quito",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["quito"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
