[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quito"
version = "0.1.0"
description = "QUITO: Time Series Forecasting Framework"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Alipay", email = "opensource@alipay.com"}
]
keywords = [
    "time-series",
    "forecasting",
    "deep-learning",
    "transformer",
    "machine-learning",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pyyaml>=5.4.0",
    "omegaconf>=2.1.0",
    "ray[tune]>=2.0.0",
    "pyarrow>=10.0.0",
    "fastparquet>=0.8.0",
    "tqdm>=4.60.0",
    "einops>=0.6.0",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
]

quality = [
    "statsmodels>=0.13.0",
    "arch>=5.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

foundation = [
    "chronos-forecasting>=1.0.0",
]

all = [
    "quito[dev,quality,foundation]",
]

[project.urls]
Homepage = "https://github.com/alipay/quito-10b"
Repository = "https://github.com/alipay/quito-10b"
Documentation = "https://github.com/alipay/quito-10b/tree/main/docs"
"Bug Tracker" = "https://github.com/alipay/quito-10b/issues"

[project.scripts]
quito-cli = "cli:main"

[tool.setuptools]
packages = ["quito", "quito.config", "quito.models", "quito.trainers", "quito.utils"]
py-modules = ["cli"]
include-package-data = true

[tool.setuptools.package-data]
quito = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--cov=quito",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["quito"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
