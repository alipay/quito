# Moirai Pretraining Configuration Example
data:
  common:
    data_dir: "examples/datasets/parquet_data"
    seq_len: 512       # Context length for pretraining
    forecast_horizon: 96 # Prediction length (part of the sequence to mask/predict)
    features: "M"      # Multivariate
    normalize: True
  datasets:
    EXAMPLE_DATA:
      file_name: "open_hour_train/hour_train_hour_p1.parquet"
      train_ratio: 0.8
      valid_ratio: 0.1
      test_ratio: 0.1
      is_pretrain: True
      freq: 'H'
      ds_cls: 'TimeSeriesDataset'
      ds_kwargs: {}
      target: 'value' # Or 'ind_1' etc.
model:
  model_name: "moriai"
  mode: "pretrain"  # Enable pretraining mode
  pretrained_model_name_or_path: "Salesforce/moirai-1.0-R-small" # Start from small pretrained
  prediction_length: 96
  context_length: 512
  patch_size: 64
  num_samples: 100
  target_dim: 1
  feat_dynamic_real_dim: 0
  past_feat_dynamic_real_dim: 0
training:
  trainer_name: 'trainer'
  num_epochs: 5
  batch_size: 16
  eval_batch_size: 16
  learning_rate: 0.0001 # Lower LR for fine-tuning
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  seed: 42
  num_workers: 2
  pin_memory: True
  shuffle: True
  save_last_k: 3
  loss: 'mse' # Ignored by MoiraiModule, but required by config
  loss_kwargs: {}
  drop_last: True
optimization:
  fp16: True
  num_workers: 2
  scheduler: "cosine"
  scheduler_kwargs: {
    T_max: 5,
    eta_min: 0.00001
  }
  optimizer: "adamw"
  optimizer_kwargs: {}
checkpointing:
  save_last_k: 3
  save_epochs: 1
  save_steps: null
logging:
  output_dir: "outputs/moirai_pretrain_example"
  logging_steps: 10
  logging_epochs: 1
  sync_loss: False
  sync_score: True
early_stopping:
  enable_early_stopping: True
  early_stopping_patience: 3
  es_metric: "loss" # Moirai pretraining returns 'loss' dict key
  greater_is_better: False
evaluation:
  eval_metrics: [] # Pretraining evaluation is just loss
  eval_epochs: 1
  eval_steps: null
  save_eval_results_top_k: 0
resume:
  checkpoint_path: null
distributed:
  ddp_find_unused_parameters: False
  ddp_backend: "nccl"

