# HuggingFace Generic Model Configuration Example

data:
  common:
    data_dir: "examples/datasets/parquet_data"
    seq_len: 512
    decoder_label_len: 48
    forecast_horizon: 96
    features: "S"
    normalize: True
  datasets:
    EXAMPLE_DATA: 
      file_name: "open_hour_train/hour_train_hour_p1.parquet"
      train_ratio: 0.7
      valid_ratio: 0.2
      test_ratio: 0.1
      is_pretrain: True
      freq: 'H'
      ds_cls: 'TimeSeriesDataset'
      ds_kwargs: {}
      target: 'value'

model:
  model_name: "huggingface"
  pretrained_model_name_or_path: "google/timesfm-1.0-200m"
  trust_remote_code: True

training:
  trainer_name: 'trainer'
  num_epochs: 5
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_ratio: 0.0
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  seed: 42
  num_workers: 2
  pin_memory: True
  shuffle: True
  save_last_k: 3
  loss: 'mse'
  loss_kwargs: {}
  drop_last: False

optimization:
  fp16: False
  num_workers: 2
  scheduler: "cosine"
  scheduler_kwargs: {
    T_max: 5,
    eta_min: 0.00001
  }
  optimizer: "adamw"
  optimizer_kwargs: {}

checkpointing:
  save_last_k: 3
  save_epochs: 1
  save_steps: null

logging:
  output_dir: "outputs/hf_example"
  logging_steps: 50
  logging_epochs: 1
  sync_loss: False
  sync_score: True

early_stopping:
  enable_early_stopping: False
  early_stopping_patience: 3
  es_metric: "mse"
  greater_is_better: False

evaluation:
  eval_metrics: ['mse', 'mae']
  eval_epochs: 1
  eval_steps: null
  save_eval_results_top_k: 3
  
resume:
  checkpoint_path: null

distributed:
  ddp_find_unused_parameters: False
  ddp_backend: "nccl"

